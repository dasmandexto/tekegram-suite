<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Suite Web</title>
<style>
  :root { --bg:#0e1014; --panel:#151820; --panel2:#1a1e28; --border:#262c3a; --text:#e6e9ef;
          --muted:#8b93a7; --accent:#5a8dee; --ok:#3ddc84; --warn:#ffb020; --err:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  nav { width:230px; background:var(--panel); border-right:1px solid var(--border); padding:16px 10px; flex-shrink:0; }
  nav .logo { font-size:17px; font-weight:700; padding:6px 10px 16px; }
  nav a { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:var(--text);
          text-decoration:none; font-size:14px; margin-bottom:2px; }
  nav a:hover { background:var(--panel2); }
  nav a.active { background:var(--accent); color:#fff; }
  nav .sep { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:14px 12px 6px; }

  /* ---------- main ---------- */
  main { flex:1; padding:22px 28px; max-width:1000px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:18px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }

  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .row:last-child { border-bottom:none; }
  .pill { font-size:12px; padding:2px 10px; border-radius:20px; white-space:nowrap; }
  .pill.alive,.pill.ok,.pill.registered { background:#123524; color:var(--ok); }
  .pill.banned,.pill.dead,.pill.error { background:#3a1416; color:var(--err); }
  .pill.flood,.pill.warn { background:#3a2a10; color:var(--warn); }
  .pill.unknown,.pill.running { background:#232833; color:var(--muted); }

  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  label b { color:var(--err); } /* звезда обязательного */
  input[type=text], input[type=number], textarea, select {
      width:100%; background:#0e1014; border:1px solid var(--border); color:var(--text);
      border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .check { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 18px; font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  button.danger { background:var(--err); }
  button:disabled { opacity:.5; cursor:not-allowed; }

  .console { background:#0a0c10; border:1px solid var(--border); border-radius:8px; padding:12px;
             font-family:ui-monospace,monospace; font-size:12px; max-height:320px; overflow-y:auto; }
  .console .line { padding:2px 0; border-bottom:1px dashed #1c212c; word-break:break-word; }
  .console .lvl { font-weight:600; } .lvl.info{color:var(--ok)} .lvl.warn{color:var(--warn)} .lvl.error{color:var(--err)}
  .muted { color:var(--muted); font-size:12px; }
  #toast { position:fixed; bottom:20px; right:20px; background:var(--panel2); border:1px solid var(--border);
           padding:12px 18px; border-radius:10px; display:none; max-width:380px; z-index:9; }
  .badge { font-size:12px; color:var(--muted); border:1px solid var(--border); padding:3px 10px; border-radius:20px; }
</style>
</head>
<body>
<nav>
  <div class="logo">🦖 Telegram Suite</div>
  <div class="sep">Обзор</div>
  <a href="#" data-view="dashboard" class="active">📊 Дашборд</a>
  <div class="sep">Модули</div>
  <div id="nav-modules"></div>
</nav>

<main>
  <!-- ДАШБОРД -->
  <div id="view-dashboard">
    <h1>Дашборд</h1>
    <div class="sub">Состояние аккаунтов и журнал всех модулей</div>
    <div class="card">
      <h2>Аккаунты <span class="badge" id="apiBadge">API: —</span></h2>
      <div id="accounts"><div class="muted">загрузка…</div></div>
      <div class="actions"><button id="btnCheck">Проверить аккаунты (checker)</button></div>
    </div>
    <div class="card">
      <h2>Консоль — журнал событий</h2>
      <div class="console" id="events"><div class="muted">пока пусто</div></div>
    </div>
  </div>

  <!-- СТРАНИЦА МОДУЛЯ -->
  <div id="view-module" style="display:none">
    <h1 id="mTitle">—</h1>
    <div class="sub" id="mDesc">—</div>
    <div class="card">
      <h2>Настройки модуля</h2>
      <div id="mForm"></div>
      <div class="actions">
        <button id="mSave" class="ghost">Сохранить настройки</button>
        <button id="mRunDry">Запустить (dry-run)</button>
        <button id="mRunReal" class="danger" style="display:none">Запустить (реально)</button>
      </div>
      <div class="muted" id="mSendNote" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2>Статус задачи</h2>
      <div id="mTask" class="muted">нет активных задач</div>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const ICONS = {checker:'✅',broadcast:'📣',parser:'🔎',inviter:'➕',cloner:'🧬',autoresponder:'🤖',
               phonechecker:'📱',profiler:'🖼️',tdata2session:'📦',reporter:'🚩',booster:'👁️',registrator:'🆕'};
let SCHEMAS = {};
let current = null;
let taskTimer = null;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',4000); }
async function api(path, opts={}) {
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  if(!r.ok){ const e=await r.json().catch(()=>({detail:r.statusText})); throw new Error(e.detail||r.statusText); }
  return r.json();
}

/* ---------- навигация ---------- */
function show(view, module=null){
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active', a.dataset.view===view && (!module || a.dataset.module===module)));
  $('#view-dashboard').style.display = view==='dashboard' ? 'block':'none';
  $('#view-module').style.display = view==='module' ? 'block':'none';
  if(view==='dashboard') loadOverview();
}

/* ---------- схемы -> меню и формы ---------- */
async function loadSchemas(){
  SCHEMAS = await api('/api/schemas');
  $('#nav-modules').innerHTML = Object.keys(SCHEMAS).map(n =>
    `<a href="#" data-view="module" data-module="${n}">${ICONS[n]||'🔧'} ${n}</a>`).join('');
  document.querySelectorAll('nav a[data-view=module]').forEach(a =>
    a.onclick = e => { e.preventDefault(); showModule(a.dataset.module); });
}
function showModule(name){
  const s = SCHEMAS[name]; if(!s) return;
  current = {name, schema:s};
  show('module', name);
  $('#mTitle').innerHTML = (ICONS[name]||'🔧')+' '+name;
  $('#mDesc').textContent = s.description || '';
  $('#mRunReal').style.display = s.send_flag ? 'inline-block':'none';
  $('#mSendNote').textContent = s.send_flag
      ? 'Модуль по умолчанию работает в dry-run. «Реально» выполняет действие.'
      : 'Модуль выполняется сразу после запуска (dry-run внутри, где предусмотрен).';
  $('#mTask').textContent = 'нет активных задач';
  $('#mForm').innerHTML = s.fields.map(f => fieldHtml(f, (s.saved_config||{})[f['key']])).join('');
  document.querySelectorAll('#mForm [data-key]').forEach(el => {
    const f = s.fields.find(x=>x.key===el.dataset.key);
    if(f && f.type==='bool' && (s.saved_config||{})[f.key]) el.checked = true;
  });
}
function fieldHtml(f, saved){
  const val = saved !== undefined ? saved : f.default;
  const req = f.required ? ' <b>*</b>' : '';
  const id = `f_${f.key}`;
  if(f.type==='textarea')
    return `<label for="${id}">${f.label}${req}</label><textarea id="${id}" data-key="${f.key}" placeholder="${f.placeholder||''}">${val||''}</textarea>`;
  if(f.type==='number')
    return `<label for="${id}">${f.label}${req}</label><input type="number" id="${id}" data-key="${f.key}" value="${val??0}">`;
  if(f.type==='bool')
    return `<div class="check"><input type="checkbox" id="${id}" data-key="${f.key}"><label for="${id}" style="margin:0">${f.label}</label></div>`;
  if(f.type==='select')
    return `<label for="${id}">${f.label}${req}</label><select id="${id}" data-key="${f.key}">${f.options.map(([v,l])=>`<option value="${v}" ${v===val?'selected':''}>${l}</option>`).join('')}</select>`;
  return `<label for="${id}">${f.label}${req}</label><input type="text" id="${id}" data-key="${f.key}" value="${val||''}">`;
}
function formValues(){
  const out = {};
  document.querySelectorAll('#mForm [data-key]').forEach(el => {
    out[el.dataset.key] = el.type==='checkbox' ? el.checked : el.value;
  });
  return out;
}

/* ---------- сохранение и запуск ---------- */
$('#mSave').onclick = async () => {
  if(!current) return;
  try{ await api(`/api/config/${current.name}`, {method:'POST', body:JSON.stringify(formValues())}); toast('Настройки сохранены'); }
  catch(e){ toast(e.message); }
};
$('#mRunDry').onclick = () => runModule(false);
$('#mRunReal').onclick = () => { if(confirm('Реальный запуск: действие будет выполнено по-настоящему. Продолжить?')) runModule(true); };
async function runModule(real){
  if(!current) return;
  const payload = {...formValues()};
  if(current.schema.send_flag) payload[current.schema.send_flag] = real;
  try{
    const r = await api(`/api/run/${current.name}`, {method:'POST', body:JSON.stringify(payload)});
    toast(real ? 'Запущено (реально)' : 'Запущено (dry-run)');
    pollTask(r.task_id);
  }catch(e){ toast(e.message); }
}
function pollTask(id){
  clearInterval(taskTimer);
  $('#mTask').innerHTML = '<span class="pill running">running</span>';
  taskTimer = setInterval(async ()=>{
    try{
      const t = await api('/api/tasks/'+id);
      $('#mTask').innerHTML = `<span class="pill ${t.status}">${t.status}</span>`+(t.error?` <span class="muted">${t.error}</span>`:'');
      if(t.status!=='running'){ clearInterval(taskTimer); loadOverview(); }
    }catch(e){ clearInterval(taskTimer); }
  }, 1500);
}

/* ---------- дашборд ---------- */
async function loadOverview(){
  try{
    const d = await api('/api/overview');
    $('#apiBadge').textContent = d.api_id_set ? 'API: настроен' : 'API: не настроен';
    $('#accounts').innerHTML = d.accounts.map(a =>
      `<div class="row"><span>${a.name}</span><span class="pill ${a.status}">${a.status}</span></div>`).join('')
      || '<div class="muted">нет сессий — положите *.session в sessions/</div>';
    $('#events').innerHTML = d.events.map(e =>
      `<div class="line"><span class="lvl ${e.level}">${e.level}</span> ${e.ts} · ${e.module||''} · ${e.message}</div>`).join('')
      || '<div class="muted">пока пусто</div>';
  }catch(e){ toast(e.message); }
}
$('#btnCheck').onclick = async () => {
  try{ const r = await api('/api/checker', {method:'POST'}); toast('Чекер запущен');
    const iv = setInterval(async ()=>{ const t=await api('/api/tasks/'+r.task_id).catch(()=>null);
      if(t && t.status!=='running'){ clearInterval(iv); loadOverview(); } }, 1500);
  }catch(e){ toast(e.message); }
};

show('dashboard'); loadSchemas(); setInterval(loadOverview, 10000);
</script>
</body>
</html>
